[tool.pyrefly]
# Point Pyrefly at the virtual environment where fastapi/pydantic/etc. are installed
python_interpreter = "execution-engine/.venv/Scripts/python.exe"

# Only check actual Python source files inside execution-engine
source = ["execution-engine"]

# Exclude non-Python content that Pyrefly tries to lint
exclude = [
    "**/*.md",
    "**/__pycache__",
    "**/node_modules",
    "**/.next",
    "**/.venv",
]
